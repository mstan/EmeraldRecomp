plugins {
    id "com.android.application"
}

// Engine / UI checkouts: the pinned submodules by default; a feature worktree
// can be selected with -PgbarecompRoot=... / -PrecompUiRoot=... (or the
// GBARECOMP_ROOT / RECOMP_UI_ROOT environment variables).
def gameRoot = rootDir.parentFile
def pick = { String prop, String env, File fallback ->
    def v = providers.gradleProperty(prop).orNull ?: System.getenv(env)
    return v ? new File(v) : fallback
}
def engineRoot = pick("gbarecompRoot", "GBARECOMP_ROOT", new File(gameRoot, "gbarecomp"))
def recompUiRoot = pick("recompUiRoot", "RECOMP_UI_ROOT", new File(gameRoot, "recomp-ui"))

ext.gbaGame = [
    applicationId : "com.mstan.emeraldrecomp",
    versionCode   : 107,
    versionName   : "0.1.7",
    title         : "Pokémon Emerald",
    romLabel      : "Pokémon Emerald (USA) ROM",
    romSha1       : ["f3ae088181bf583e55daf962a92bb46f4f1d07b7"],
    romSize       : 16777216,
    romFile       : "emerald_usa.gba",
    biosRequired  : true,
    orientation   : "any",
    payloadVersion: "3",
    setupNote     : "Play in portrait or landscape: draw a path to walk, tap menus, " +
                    "long-press for the Start menu.",
    variant       : "emerald",
    gameToml      : new File(rootDir, "game_android.toml"),
    payloadDirs   : [
        [from: new File(gameRoot, "mods/preloaded"), into: "mods"],
        [from: new File(rootDir, "payload/mods"), into: "mods"],
        [from: new File(gameRoot, "tools/release-licenses"), into: "licenses/fonts"],
        [from: new File(gameRoot, "tools/android-licenses"), into: "licenses/Android-NDK"],
        [from: new File(gameRoot, "LICENSE"), into: "licenses/title"],
        [from: new File(gameRoot, "PERMISSIONS.md"), into: "licenses/title"],
        [from: new File(engineRoot, "LICENSE"), into: "licenses/gbarecomp"],
        [from: new File(engineRoot, "external/arm-recomp-core/LICENSE"), into: "licenses/arm-recomp-core"],
        [from: new File(engineRoot, "external/recomp-net/LICENSE"), into: "licenses/recomp-net"],
        [from: new File(engineRoot, "external/rbengine/LICENSE"), into: "licenses/rbengine"],
        [from: new File(engineRoot, "platform/android/third_party/SDL/LICENSE.txt"), into: "licenses/SDL2"],
        [from: new File(recompUiRoot, "LICENSE"), into: "licenses/recomp-ui"],
        [from: new File(recompUiRoot, "src/third_party/imgui/LICENSE.txt"), into: "licenses/Dear-ImGui"],
    ],
    gameRoot      : gameRoot,
    engineRoot    : engineRoot,
    recompUiRoot  : recompUiRoot,
    cmakeArguments: ["-DGBARECOMP_GENERATED_BIOS_DIR=" +
        pick("generatedBiosRoot", "GBARECOMP_GENERATED_BIOS_DIR",
            new File(engineRoot, "src/runtime/generated_bios")).absolutePath.replace('\\', '/')],
]

apply from: new File(engineRoot, "platform/android/gbarecomp-app.gradle")
