# game.toml — Pokémon Emerald Version (GBA), USA
#
# Paths resolve relative to THIS file's directory (variants/emerald/),
# per runtime.cpp resolve_config_path.

[game]
name           = "Pokémon Emerald Version"
short_name     = "emerald"
default_region = "usa"

[bios]
path = "../../../gbarecomp/bios/gba_bios.bin"   # override via --bios
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"
# HLE BIOS backend (opt-in). hle = true services SWIs via High-Level Emulation
# and skips the BIOS boot intro; any SWI HLE doesn't implement falls back to the
# recompiled (LLE) BIOS, which stays the default + correctness oracle. Set
# hle_keep_intro = true to keep the real BIOS intro while still HLE'ing SWIs.
# CLI (--bios-hle / --no-bios-hle / --bios-hle-keep-intro) and env
# (GBARECOMP_BIOS_HLE / GBARECOMP_BIOS_HLE_KEEP_INTRO) override these.
# Default is LLE (the recompiled real BIOS) — uncomment to opt in:
# hle            = true
# hle_keep_intro = false

[rom]
path = "roms/emerald_usa.gba"   # user-provided; gitignored
# sha1 filled in per region in config/<region>.toml (f3ae0881…).

# ── Recompiler program identity (consumed by gba_recompile) ─────────
#
# This file is the BASE config for the recompile: it owns [program] and
# [identity] and wins every conflict with the generated overlays layered
# on top of it (symbols/BPEE_symbols.toml, symbols/BPEE_reviewed_seeds.toml).
#
# Before 2026-08-21 the recompile was driven by the importer's generated
# symbols/emerald_usa.toml INSTEAD of this file, because only that file had
# a [program] table. That meant every regeneration silently replaced the
# hand-authored config, and no reviewed entry could survive an import. The
# values here are carried over verbatim from that generated file.
[program]
name         = "Pokemon Emerald Version (USA)"
id           = "emerald_usa"
load_address = 0x08000000
size         = 0x01000000
entry_pc     = 0x08000000
codegen_shards = 64
# Emit a native resume entry at every instruction boundary so an IRQ or SWI
# return never needs the interpreter or the self-heal path.
static_resume_all = true

[identity]
sha1 = "f3ae088181bf583e55daf962a92bb46f4f1d07b7"

[recompiler]
entry_point   = "0x08000000"
seeds         = "symbols/imported_symbols.tsv"
boundaries    = "symbols/function_boundaries.tsv"
out_dir       = "generated"
strict        = true

[save]
type = "flash1m"          # Emerald: 1 Mbit (128 KB) flash + RTC

[runtime]
debug_port    = 19892
window_title  = "EmeraldRecomp"

[functions]
arm   = []
thumb = []

# ── Runtime code copy that is NOT symbol-derivable ──────────────────────
# VerifyFlashSector (agb_flash.c) stack-copies VerifyFlashSector_Core into a
# stack-local buffer and calls it there, once per sector written by a save.
# A stack destination has no symbol for the importer, so it is stated here;
# it is deterministic for the in-game save path (Start > SAVE). Reviewed
# 2026-09-23: after a bridged save the 0x30 live bytes at 0x03007C74 equal
# ROM 0x082E1B70..0x082E1BA0 exactly (tools/touch_scenarios.py --bridge
# save_prompt_tap_outside), and that was the only dispatch miss (x14, one per
# sector). Boot (flash ID, save load) is already fully static. Another call
# depth would surface as a loud miss at a different stack address. Same
# helper class as FRLG's ReadFlash1_stack and beads-mc7.4 (Ruby/Sapphire).
[[code_copy]]
runtime_start = 0x03007C74
source_start  = 0x082E1B70
size          = 0x30
name          = "VerifyFlashSector_Core_stack_Buffer"
note = "VerifyFlashSector stack-copies VerifyFlashSector_Core (save-path verify)"

[[extra_func]]
addr = 0x03007C74
mode = "thumb"
name = "VerifyFlashSector_Core_stack"
note = "THUMB entry of the VerifyFlashSector_Core stack copy above"

# ── Touch input probes (src/touch/emerald_scene.cpp) ─────────────────────
# Observe-only entry guards: the registered callbacks always decline, so the
# original guest bodies run unchanged. They report which menu-input routine
# processed input this frame, so taps map onto the menu actually on screen.
[[mod_function_hook]]
addr = 0x0819856C
mode = "thumb"
note = "Menu_ProcessInput — sMenu live (wrapping)"

[[mod_function_hook]]
addr = 0x081985D8
mode = "thumb"
note = "Menu_ProcessInputNoWrap — sMenu live"

[[mod_function_hook]]
addr = 0x08198658
mode = "thumb"
note = "ProcessMenuInput_other — sMenu live (wrapping)"

[[mod_function_hook]]
addr = 0x081986C4
mode = "thumb"
note = "Menu_ProcessInputNoWrapAround_other — sMenu live"

[[mod_function_hook]]
addr = 0x08198C58
mode = "thumb"
note = "Menu_ProcessInputNoWrapClearOnChoose — Yes/No and similar"

[[mod_function_hook]]
addr = 0x08199334
mode = "thumb"
note = "Menu_ProcessGridInput — grid sMenu live"

[[mod_function_hook]]
addr = 0x081AE604
mode = "thumb"
note = "ListMenu_ProcessInput(listTaskId) — list menu live"

[[mod_function_hook]]
addr = 0x08085DAC
mode = "thumb"
note = "DoCB1_Overworld — field input processed this frame"
