format_version = 1
id = "pokemon-emerald.enhancement.widescreen"
version = "0.2.0"
name = "Emerald Widescreen Experiment"
author = "mstan"
description = "Reveal more overworld scenery and NPCs at the original pixel scale. Unloaded NPCs use idle poses; distant AI and special effects are not expanded."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "pokemon-emerald-us"
rom_sha1 = "f3ae088181bf583e55daf962a92bb46f4f1d07b7"

[[feature]]
id = "widescreen"
name = "Overworld Widescreen (Experimental)"
description = "Expand the overworld in landscape or portrait, with anchored menus and continuous door animations. Battles and unsupported screens stay centered."
group = "Presentation"
default_enabled = true

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect ratio"
description = "Fit follows landscape or portrait windows. Fixed modes keep their chosen aspect ratio."
type = "choice"
default = "fit"

[[option.choice]]
value = "fit"
label = "Fit to window"
[[option.choice]]
value = "16:9"
label = "16:9"
[[option.choice]]
value = "21:9"
label = "21:9"
[[option.choice]]
value = "32:9"
label = "32:9"

[[plugin]]
feature = "widescreen"
id = "pokemon-emerald.widescreen.v2"
